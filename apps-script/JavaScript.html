<script>
/* ===== data source mode =====
   "static" (this file): 195-book snapshot embedded + per-browser adds/edits in localStorage.
   "gas"   (Apps Script): every book comes from the live Google Sheet and edits write back.
   gen_gas.py flips MODE to "gas" and blanks EMBED. */
const MODE  = "gas";
const IS_GAS = MODE === "gas";
const EMBED = [];

const ADDED_KEY = "krida-puech-books-added";
function loadAdded(){ try{ return JSON.parse(localStorage.getItem(ADDED_KEY))||[]; }catch(e){ return []; } }
function saveAdded(arr){ try{ localStorage.setItem(ADDED_KEY, JSON.stringify(arr)); }catch(e){} }
function newId(){ return "u"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

const BOOKS = [];
let addedBooks = [];
function loadData(){
  BOOKS.length = 0;
  if (IS_GAS){
    (window.__BOOKS__ || []).forEach(b=>BOOKS.push(b));   // each carries a sheet .row
  } else {
    EMBED.forEach(b=>BOOKS.push(b));
    addedBooks = loadAdded();
    let backfill=false;
    addedBooks.forEach(b=>{ b._new=true; if(!b._id){ b._id=newId(); backfill=true; } BOOKS.push(b); });
    if(backfill) saveAdded(addedBooks);
  }
}
loadData();

/* which books can be edited, and how each is identified */
function canEdit(b){ return IS_GAS ? true : !!b._new; }              // gas: all books · static: only ones you added
function bookId(b){ return IS_GAS ? ("r"+b.row) : b._id; }
function findById(key){ return BOOKS.find(b=>bookId(b)===key); }
function editBtnHTML(b){ return canEdit(b)
  ? `<button class="editbtn" data-edit="${bookId(b)}" title="แก้ไข / Edit" aria-label="แก้ไข">✎</button>` : ""; }

const STATUS = {
  "Done":       {th:"อ่านจบแล้ว", en:"Done",        cls:"done",     color:"var(--done)"},
  "In progress":{th:"กำลังอ่าน",  en:"In progress", cls:"progress", color:"var(--progress)"},
  "Wished":     {th:"อยากอ่าน",   en:"Wished",      cls:"wished",   color:"var(--wished)"},
  "Not Start":  {th:"ยังไม่เริ่ม", en:"Not Start",   cls:"notstart", color:"var(--notstart)"}
};
const STATUS_ORDER = ["Done","In progress","Wished","Not Start"];
const reduceMotion = matchMedia("(prefers-reduced-motion:reduce)").matches;
let ANIM = true; /* animate count-ups only on first paint */

/* ---------- helpers ---------- */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function parseDate(s){ if(!s) return null; const m=s.split("/"); if(m.length!==3) return null;
  const d=+m[0],mo=+m[1]-1,y=+m[2]; const dt=new Date(y,mo,d); return isNaN(dt)?null:dt; }
function starHTML(n){ if(!n) return '<span class="stars none">— ยังไม่ให้คะแนน</span>';
  let s=""; for(let i=1;i<=5;i++) s+= i<=n?"★":'<span class="off">★</span>'; return '<span class="stars">'+s+'</span>'; }

/* ---------- stats ---------- */
function computeStats(bs){
  const total=bs.length;
  const byStatus={}; STATUS_ORDER.forEach(s=>byStatus[s]=0);
  bs.forEach(b=>{ byStatus[b.status]=(byStatus[b.status]||0)+1; });
  const done=byStatus["Done"]||0;

  const cats={};
  bs.forEach(b=>{ const g=b.genre||"—"; (cats[g]=cats[g]||{inlist:0,done:0}); cats[g].inlist++; if(b.status==="Done")cats[g].done++; });

  const rated=bs.filter(b=>b.rating>0);
  const ratingDist={5:0,4:0,3:0,2:0,1:0}; rated.forEach(b=>ratingDist[b.rating]++);
  const avg = rated.length? rated.reduce((a,b)=>a+b.rating,0)/rated.length : 0;
  const fiveStar = ratingDist[5];

  const years={};
  bs.forEach(b=>{ const d=parseDate(b.completed); if(d) years[d.getFullYear()]=(years[d.getFullYear()]||0)+1; });

  const auth={};
  bs.forEach(b=>{ let a=(b.author||"").trim(); if(!a||/^unknow/i.test(a))return; auth[a]=(auth[a]||0)+1; });
  const topAuthors=Object.entries(auth).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const authorCount=Object.keys(auth).length;

  return {total,byStatus,done,cats,ratingDist,avg,fiveStar,rated:rated.length,years,topAuthors,authorCount};
}

/* ---------- count up ---------- */
function countUp(el,to,dur=1000,suffix=""){
  if(reduceMotion||!ANIM){ el.textContent=to+suffix; return; }
  const start=performance.now();
  (function tick(t){ const p=Math.min(1,(t-start)/dur); const e=1-Math.pow(1-p,3);
    el.textContent=Math.round(to*e)+suffix; if(p<1)requestAnimationFrame(tick); })(start);
}

/* ---------- render analytics ---------- */
let S = computeStats(BOOKS);

function renderHeroAndKpis(){
  const pct = S.total? Math.round(S.done/S.total*1000)/10 : 0;
  countUp(document.getElementById("pcDoneN"),S.done,1100);
  document.getElementById("pcTotal").textContent=" / "+S.total+" เล่ม";
  document.getElementById("pcPct").textContent=pct+"%";
  document.getElementById("pcFootL").textContent="กำลังอ่าน "+S.byStatus["In progress"]+" · อยากอ่าน "+S.byStatus["Wished"];
  document.getElementById("pcFootR").textContent="Not started "+S.byStatus["Not Start"];
  requestAnimationFrame(()=>{ document.getElementById("pcBar").style.width=pct+"%"; });

  const kpis=[
    {n:S.total, l:"หนังสือทั้งหมด", en:"TOTAL BOOKS"},
    {n:S.done, l:"อ่านจบแล้ว", en:"FINISHED", u:""},
    {n:S.byStatus["In progress"], l:"กำลังอ่าน", en:"READING NOW"},
    {n:S.byStatus["Wished"], l:"อยากอ่าน", en:"WISHLIST"},
    {n:S.avg.toFixed(2), l:"คะแนนเฉลี่ย", en:"AVG RATING", star:true, u:"★"},
    {n:S.fiveStar, l:"หนังสือ 5 ดาว", en:"FIVE-STAR", star:true}
  ];
  const wrap=document.getElementById("kpis");
  wrap.innerHTML=kpis.map(k=>`<div class="kpi${k.star?' star':''}">
    <div class="n"><span data-n="${k.n}">0</span>${k.u?`<span class="u">${k.u}</span>`:""}</div>
    <div class="l">${k.l}<span class="en">${k.en}</span></div></div>`).join("");
  wrap.querySelectorAll("[data-n]").forEach(el=>{
    const v=el.getAttribute("data-n");
    if(String(v).includes(".")){ if(reduceMotion||!ANIM){el.textContent=v;} else {
      const start=performance.now(); (function tick(t){const p=Math.min(1,(t-start)/1000);const e=1-Math.pow(1-p,3);
      el.textContent=(parseFloat(v)*e).toFixed(2); if(p<1)requestAnimationFrame(tick);})(start);} }
    else countUp(el,+v,1000);
  });
}

function renderCategoryBars(){
  const rows=Object.entries(S.cats).map(([g,v])=>({g,...v,pct:v.inlist?v.done/v.inlist*100:0}))
    .sort((a,b)=>b.pct-a.pct || b.inlist-a.inlist);
  document.getElementById("catBars").innerHTML=rows.map(r=>`
    <div class="catrow">
      <div class="top"><span class="name">${esc(r.g)}</span>
        <span class="val"><b>${r.done}</b>/${r.inlist} · ${Math.round(r.pct)}%</span></div>
      <div class="ctrack"><i data-w="${r.pct}"></i></div>
    </div>`).join("");
  animateBars("#catBars .ctrack > i");
}

function renderDonut(){
  const size=168,r=68,cx=84,cy=84,C=2*Math.PI*r,gap=2;
  let off=0; const segs=[];
  STATUS_ORDER.forEach(s=>{
    const val=S.byStatus[s]||0; if(!val)return;
    const frac=val/S.total, len=frac*C;
    segs.push(`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${STATUS[s].color}"
      stroke-width="20" stroke-dasharray="${Math.max(0,len-gap)} ${C-Math.max(0,len-gap)}"
      stroke-dashoffset="${-off}" stroke-linecap="round" style="transition:stroke-dasharray .9s ease"/>`);
    off+=len;
  });
  document.getElementById("donut").innerHTML=
    `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--bg-soft)" stroke-width="20"/>
      ${segs.join("")}
    </svg><div class="center"><b>${S.total}</b><span>เล่ม · books</span></div>`;
  document.getElementById("donutLegend").innerHTML=STATUS_ORDER.map(s=>{
    const v=S.byStatus[s]||0, pc=S.total?Math.round(v/S.total*100):0;
    return `<div class="li"><span class="dot" style="background:${STATUS[s].color}"></span>
      <span class="nm">${STATUS[s].th} <span style="color:var(--dim);font-size:11px">${STATUS[s].en}</span></span>
      <span class="ct">${v}</span><span class="pc">${pc}%</span></div>`;
  }).join("");
}

function renderRatings(){
  const max=Math.max(1,...Object.values(S.ratingDist));
  let html="";
  for(let k=5;k>=1;k--){ const v=S.ratingDist[k]; const w=v/max*100;
    html+=`<div class="rrow"><span class="rk">${"★".repeat(k)}</span>
      <span class="rt"><i data-w="${w}"></i></span><span class="rc">${v}</span></div>`; }
  document.getElementById("ratingBars").innerHTML=html;
  animateBars("#ratingBars .rt > i");
}

function renderYears(){
  const ys=Object.keys(S.years).map(Number).sort();
  const max=Math.max(1,...Object.values(S.years));
  const el=document.getElementById("years");
  if(!ys.length){ el.innerHTML='<div class="sub-note">ยังไม่มีข้อมูลวันที่อ่านจบ</div>'; return; }
  el.innerHTML=ys.map(y=>{ const v=S.years[y]; const h=v/max*100;
    return `<div class="ybar"><div class="col" data-h="${h}"><span>${v}</span></div><div class="yl">${y}</div></div>`; }).join("");
  requestAnimationFrame(()=>setTimeout(()=>{
    el.querySelectorAll(".col").forEach(c=>{ c.style.height=(reduceMotion?c.dataset.h:c.dataset.h)+"%"; });
  },80));
}

function renderAuthors(){
  const max=S.topAuthors.length?S.topAuthors[0][1]:1;
  document.getElementById("authors").innerHTML=S.topAuthors.map(([a,n])=>`
    <div class="arow"><span class="an" title="${esc(a)}">${esc(a)}</span>
      <span class="at"><i data-w="${n/max*100}"></i></span><span class="ac">${n}</span></div>`).join("");
  animateBars("#authors .at > i");
}

function animateBars(sel){
  requestAnimationFrame(()=>setTimeout(()=>{
    document.querySelectorAll(sel).forEach(i=>{ i.style.width=i.dataset.w+"%"; });
  },60));
}

/* ---------- explorer ---------- */
const state={q:"",status:"all",genre:"all",sort:"finished",view:"grid"};

function renderChips(){
  const chips=document.getElementById("statusChips");
  let html=`<button class="chip${state.status==='all'?' on':''}" data-s="all">ทั้งหมด <span class="c">${BOOKS.length}</span></button>`;
  STATUS_ORDER.forEach(s=>{ const v=S.byStatus[s]||0; if(!v)return;
    html+=`<button class="chip${state.status===s?' on':''}" data-s="${s}"><span class="sd" style="background:${STATUS[s].color}"></span>${STATUS[s].th} <span class="c">${v}</span></button>`; });
  chips.innerHTML=html;
}
function renderGenreOptions(){
  const genres=[...new Set(BOOKS.map(b=>b.genre).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"th"));
  const cur=state.genre;
  document.getElementById("genreSel").innerHTML=
    `<option value="all">ทุกหมวดหมู่ · All genres</option>`+genres.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join("");
  document.getElementById("genreSel").value=(cur==="all"||genres.includes(cur))?cur:"all";
  const dl=document.getElementById("genreList");
  if(dl) dl.innerHTML=genres.map(g=>`<option value="${esc(g)}"></option>`).join("");
}
function refresh(){
  S=computeStats(BOOKS);
  renderHeroAndKpis(); renderCategoryBars(); renderDonut(); renderRatings();
  renderYears(); renderAuthors(); renderChips(); renderGenreOptions(); render();
}
function buildControls(){
  renderChips();
  renderGenreOptions();
  document.getElementById("statusChips").addEventListener("click",e=>{
    const c=e.target.closest(".chip"); if(!c)return;
    state.status=c.dataset.s; renderChips(); render();
  });
  document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value.toLowerCase();render();});
  document.getElementById("genreSel").addEventListener("change",e=>{state.genre=e.target.value;render();});
  document.getElementById("sortSel").addEventListener("change",e=>{state.sort=e.target.value;render();});
  document.getElementById("vGrid").addEventListener("click",()=>setView("grid"));
  document.getElementById("vTable").addEventListener("click",()=>setView("table"));
}
function setView(v){ state.view=v;
  document.getElementById("vGrid").classList.toggle("active",v==="grid");
  document.getElementById("vTable").classList.toggle("active",v==="table");
  document.getElementById("vGrid").setAttribute("aria-pressed",v==="grid");
  document.getElementById("vTable").setAttribute("aria-pressed",v==="table");
  render();
}

function currentList(){
  let list=BOOKS.filter(b=>{
    if(state.status!=="all" && b.status!==state.status) return false;
    if(state.genre!=="all" && b.genre!==state.genre) return false;
    if(state.q){ const h=(b.title+" "+b.author).toLowerCase(); if(!h.includes(state.q)) return false; }
    return true;
  });
  const so=state.sort;
  list.sort((a,b)=>{
    if(so==="title") return a.title.localeCompare(b.title,"th");
    if(so==="author") return (a.author||"~").localeCompare(b.author||"~","th");
    if(so==="rating") return (b.rating-a.rating) || a.title.localeCompare(b.title,"th");
    // finished: newly added first, then dated desc, then rating
    if(a._new&&!b._new) return -1;
    if(b._new&&!a._new) return 1;
    const da=parseDate(a.completed), db=parseDate(b.completed);
    if(da&&db) return db-da;
    if(da&&!db) return -1;
    if(!da&&db) return 1;
    return (b.rating-a.rating) || a.title.localeCompare(b.title,"th");
  });
  return list;
}

function cardHTML(b){
  const st=STATUS[b.status]||{th:b.status,en:"",cls:"notstart"};
  const d=parseDate(b.completed);
  const dateStr = d ? `<span class="date"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>${esc(b.completed)}</span>` : `<span class="date"></span>`;
  return `<article class="card${b._new?' isnew':''}">
    <div class="r1"><span class="r1l"><span class="gtag">${esc(b.genre||"—")}</span>${b._new?'<span class="newtag">NEW</span>':''}</span>
      <span class="r1r"><span class="pill ${st.cls}"><span class="sd" style="background:${st.color||'var(--notstart)'}"></span>${st.th}</span>${editBtnHTML(b)}</span></div>
    <div class="title" title="${esc(b.title)}">${esc(b.title)}</div>
    <div class="auth"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>${esc(b.author||"ไม่ระบุผู้เขียน")}</div>
    <div class="r3">${starHTML(b.rating)}${dateStr}</div>
  </article>`;
}

function rowHTML(b){
  const st=STATUS[b.status]||{th:b.status,cls:"notstart"};
  return `<tr>
    <td class="tt">${esc(b.title)}${b._new?' <span class="newtag">NEW</span>':''}${editBtnHTML(b)}</td>
    <td class="aa">${esc(b.author||"—")}</td>
    <td><span class="gtag">${esc(b.genre||"—")}</span></td>
    <td><span class="pill ${st.cls}"><span class="sd" style="background:${st.color||'var(--notstart)'}"></span>${st.th}</span></td>
    <td>${starHTML(b.rating)}</td>
    <td class="mono" style="color:var(--dim);font-size:12px">${esc(b.completed||"—")}</td>
  </tr>`;
}

function render(){
  const list=currentList();
  const c=document.getElementById("count");
  c.innerHTML=`แสดง <b>${list.length}</b> จาก ${BOOKS.length} เล่ม`;
  const res=document.getElementById("results");
  if(!list.length){ res.innerHTML=`<div class="empty"><div class="big">🔍</div>ไม่พบหนังสือที่ตรงกับเงื่อนไข<br><span style="font-size:12px">No books match your filters</span></div>`; return; }
  if(state.view==="grid"){
    res.innerHTML=`<div class="grid">${list.map(cardHTML).join("")}</div>`;
  }else{
    res.innerHTML=`<div class="tablewrap"><table>
      <thead><tr><th>ชื่อหนังสือ · Title</th><th>นักเขียน · Author</th><th>หมวด · Genre</th><th>สถานะ · Status</th><th>คะแนน · Rating</th><th>อ่านจบ · Finished</th></tr></thead>
      <tbody>${list.map(rowHTML).join("")}</tbody></table></div>`;
  }
}

/* ---------- theme ---------- */
(function initTheme(){
  const btn=document.getElementById("themeBtn");
  let saved=null; try{ saved=localStorage.getItem("krida-theme"); }catch(e){}
  if(saved) document.documentElement.setAttribute("data-theme",saved);
  function sync(){
    const explicit=document.documentElement.getAttribute("data-theme");
    const dark = explicit? explicit==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
    document.getElementById("themeIco").textContent = dark? "☀" : "☾";
    document.getElementById("themeTxt").textContent = dark? "Light" : "Dark";
  }
  btn.addEventListener("click",()=>{
    const cur=document.documentElement.getAttribute("data-theme")
      || (matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
    const next=cur==="dark"?"light":"dark";
    document.documentElement.setAttribute("data-theme",next);
    try{ localStorage.setItem("krida-theme",next); }catch(e){}
    sync();
  });
  sync();
})();

/* ---------- add book (modal + persistence) ---------- */
function toast(msg){
  const t=document.getElementById("toast"); if(!t)return;
  t.innerHTML='<span style="color:var(--done)">✓</span> '+esc(msg);
  t.classList.add("show"); clearTimeout(toast._t);
  toast._t=setTimeout(()=>t.classList.remove("show"),2800);
}
/* reload all books from the sheet (gas only), then run cb */
function reloadThen(cb){
  google.script.run
    .withSuccessHandler(function(bs){ BOOKS.length=0; (bs||[]).forEach(b=>BOOKS.push(b)); ANIM=false; cb&&cb(); })
    .withFailureHandler(function(err){ toast('โหลดข้อมูลไม่สำเร็จ · '+((err&&err.message)||'error')); })
    .getBookData();
}
/* persistence — branches on MODE. done()/fail() are always called. */
function persistAdd(data, done, fail){
  if(IS_GAS){
    google.script.run.withSuccessHandler(function(){ reloadThen(done); }).withFailureHandler(fail).addBook(data);
  } else {
    const book=Object.assign({_new:true,_id:newId()},data);
    BOOKS.push(book); addedBooks.push(book); saveAdded(addedBooks); done();
  }
}
function persistUpdate(key, data, done, fail){
  if(IS_GAS){
    const b=findById(key); if(!b){ fail(new Error("not found")); return; }
    google.script.run.withSuccessHandler(function(){ reloadThen(done); }).withFailureHandler(fail)
      .updateBook(Object.assign({row:b.row}, data));
  } else {
    const b=findById(key); if(b) Object.assign(b,data);
    const ab=addedBooks.find(x=>x._id===key); if(ab) Object.assign(ab,data);
    saveAdded(addedBooks); done();
  }
}
function persistDelete(key, done, fail){
  // static only (delete is hidden in gas to protect the sheet's stat block)
  const i=BOOKS.findIndex(x=>bookId(x)===key); if(i>=0) BOOKS.splice(i,1);
  const j=addedBooks.findIndex(x=>x._id===key); if(j>=0) addedBooks.splice(j,1);
  saveAdded(addedBooks); done();
}

function initAddBook(){
  const overlay=document.getElementById("overlay");
  let rating=0, editingId=null, busy=false;
  const g=id=>document.getElementById(id);
  function paintStars(){ document.querySelectorAll("#starPick .s").forEach(b=>b.classList.toggle("on",+b.dataset.v<=rating)); }
  function reset(){
    ["in-title","in-author","in-genre","in-date"].forEach(id=>g(id).value="");
    g("in-status").value="Done"; rating=0; paintStars();
    g("f-title").classList.remove("invalid");
  }
  function setMode(edit){
    g("modalTitle").textContent = edit?"แก้ไขหนังสือ":"เพิ่มหนังสือใหม่";
    g("modalSub").textContent   = edit?"EDIT BOOK":"ADD A NEW BOOK";
    g("saveBtn").textContent    = edit?"บันทึกการแก้ไข":"บันทึกหนังสือ";
    g("delBtn").style.display   = (edit && !IS_GAS) ? "inline-flex":"none";  // no delete in gas
  }
  function open(){ overlay.classList.add("open"); document.body.style.overflow="hidden"; setTimeout(()=>g("in-title").focus(),40); }
  function close(){ overlay.classList.remove("open"); document.body.style.overflow=""; editingId=null; reset(); }
  function fmtDate(v){ if(!v)return""; const p=v.split("-"); if(p.length!==3)return""; return (+p[2])+"/"+(+p[1])+"/"+p[0]; }
  function toInputDate(s){ if(!s)return""; const p=String(s).split("/"); if(p.length!==3)return"";
    return p[2]+"-"+("0"+p[1]).slice(-2)+"-"+("0"+p[0]).slice(-2); }
  function readForm(){
    return { title:g("in-title").value.trim(), author:g("in-author").value.trim(),
      genre:g("in-genre").value.trim()||"—", status:g("in-status").value,
      completed:fmtDate(g("in-date").value), rating:rating };
  }
  function busyOn(msg){ busy=true; g("saveBtn").disabled=true; g("delBtn").disabled=true; g("saveBtn").dataset.lbl=g("saveBtn").textContent; g("saveBtn").textContent=msg; }
  function busyOff(){ busy=false; g("saveBtn").disabled=false; g("delBtn").disabled=false; if(g("saveBtn").dataset.lbl) g("saveBtn").textContent=g("saveBtn").dataset.lbl; }
  function openAdd(){ editingId=null; reset(); setMode(false); open(); }
  function openEdit(id){
    const b=findById(id); if(!b) return;
    editingId=id;
    g("in-title").value=b.title||""; g("in-author").value=b.author||"";
    g("in-genre").value=(b.genre&&b.genre!=="—")?b.genre:"";
    g("in-status").value=b.status||"Done";
    g("in-date").value=toInputDate(b.completed);
    rating=b.rating||0; paintStars();
    g("f-title").classList.remove("invalid");
    setMode(true); open();
  }
  function save(){
    if(busy) return;
    const data=readForm();
    if(!data.title){ g("f-title").classList.add("invalid"); g("in-title").focus(); return; }
    ANIM=false;
    const editing=!!editingId;
    busyOn("กำลังบันทึก…");
    const done=()=>{ busyOff();
      if(!editing){ state.status="all"; state.genre="all"; state.q=""; state.sort="finished"; g("q").value=""; g("sortSel").value="finished"; }
      refresh(); close();
      if(!editing) document.getElementById("explorer").scrollIntoView({behavior:reduceMotion?"auto":"smooth",block:"start"});
      toast(editing ? ('อัปเดต "'+data.title+'" แล้ว · Updated') : ('เพิ่ม "'+data.title+'" แล้ว · Book added'));
    };
    const fail=(err)=>{ busyOff(); toast('บันทึกไม่สำเร็จ · '+((err&&err.message)||'error')); };
    if(editing) persistUpdate(editingId, data, done, fail);
    else persistAdd(data, done, fail);
  }
  function del(){
    if(busy || !editingId) return;
    const b=findById(editingId); const name=b?b.title:"";
    if(!confirm('ลบ "'+name+'" ออกจากคลัง?\nRemove this book?')) return;
    ANIM=false;
    persistDelete(editingId, ()=>{ refresh(); close(); toast('ลบ "'+name+'" แล้ว · Removed'); },
      (err)=>{ toast('ลบไม่สำเร็จ · '+((err&&err.message)||'error')); });
  }
  document.querySelectorAll("#starPick .s").forEach(b=>b.addEventListener("click",()=>{ rating=+b.dataset.v; paintStars(); }));
  g("starClr").addEventListener("click",()=>{ rating=0; paintStars(); });
  g("addBtn").addEventListener("click",openAdd);
  g("addBtn2").addEventListener("click",openAdd);
  g("modalClose").addEventListener("click",()=>{ if(!busy) close(); });
  g("cancelBtn").addEventListener("click",()=>{ if(!busy) close(); });
  g("saveBtn").addEventListener("click",save);
  g("delBtn").addEventListener("click",del);
  g("in-title").addEventListener("input",()=>g("f-title").classList.remove("invalid"));
  overlay.addEventListener("click",e=>{ if(e.target===overlay && !busy) close(); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!busy&&overlay.classList.contains("open")) close(); });
  g("addForm").addEventListener("submit",e=>{ e.preventDefault(); save(); });
  document.getElementById("results").addEventListener("click",e=>{
    const btn=e.target.closest(".editbtn"); if(!btn) return;
    e.preventDefault(); e.stopPropagation(); openEdit(btn.dataset.edit);
  });
  setMode(false); reset();
}

/* ---------- boot ---------- */
function boot(){
  renderHeroAndKpis();
  renderCategoryBars();
  renderDonut();
  renderRatings();
  renderYears();
  renderAuthors();
  buildControls();
  render();
  initAddBook();
  ANIM=false;
}
boot();

/* In the Apps Script build, always pull fresh data straight from the sheet via
   google.script.run — this does not depend on any template injection in Index.html. */
if (IS_GAS){
  var _cnt=document.getElementById("count"); if(_cnt) _cnt.innerHTML="กำลังโหลดจากชีต… · Loading from sheet…";
  google.script.run
    .withSuccessHandler(function(bs){
      BOOKS.length=0; (bs||[]).forEach(function(b){ BOOKS.push(b); });
      ANIM=false; refresh();
    })
    .withFailureHandler(function(err){
      var c=document.getElementById("count");
      if(c) c.innerHTML='<b style="color:#f87171">โหลดข้อมูลไม่สำเร็จ · Failed to load:</b> '+esc((err&&err.message)||'error');
    })
    .getBookData();
}
</script>
